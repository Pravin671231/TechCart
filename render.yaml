services:
  - type: web
    name: techcart-backend
    runtime: docker
    plan: free
    region: singapore # closest Render region to the India-first target market
    branch: main
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    # The Atlas Search index backing GET /api/products' variant-attribute /
    # filterable-spec filters is provisioned by an idempotent script, not on
    # startup. Enable this once on a paid instance type (pre-deploy commands
    # aren't available on the free plan); until then run it manually against
    # the production MONGODB_URI (Render shell or locally) — see
    # backend/atlas-search/README.md.
    # preDeployCommand: node dist/src/scripts/searchIndexes/ensureSearchIndexes.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: RATE_LIMITING_ENABLED
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL_BASE
        sync: false
