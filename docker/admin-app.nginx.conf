server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router client-side routes must fall back to index.html, or a
    # direct hit / hard refresh on any non-root path 404s at the nginx level
    # before React ever gets a chance to render.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
