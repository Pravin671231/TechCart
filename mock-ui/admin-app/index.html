<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechCart Admin — Layout Mock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-screen bg-white text-neutral-600">
    <div class="flex h-screen">
      <!-- Sidebar — full height, left edge, nav area + bottom profile block -->
      <aside
        class="flex w-64 shrink-0 flex-col border-r border-neutral-400 bg-neutral-100"
      >
        <div class="flex flex-1 items-center justify-center">
          <span class="text-sm tracking-wide text-neutral-500">Side bar</span>
        </div>
        <div class="flex items-center justify-center border-t border-neutral-400 py-4">
          <span class="text-sm tracking-wide text-neutral-500">Profile</span>
        </div>
      </aside>

      <!-- Content — no header; fills remaining space directly -->
      <main class="flex flex-1 items-center justify-center">
        <span class="text-sm tracking-wide text-neutral-500">Content</span>
      </main>
    </div>
  </body>
</html>
