<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechCart Admin — Layout Mock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-screen bg-white text-neutral-600">
    <div class="flex h-screen">
      <!-- Sidebar — full height, left edge -->
      <aside
        class="flex w-64 shrink-0 items-center justify-center border-r border-neutral-400 bg-neutral-100"
      >
        <span class="text-sm tracking-wide text-neutral-500">Side bar</span>
      </aside>

      <!-- Right column — header stacked above content -->
      <div class="flex flex-1 flex-col">
        <header
          class="flex h-16 shrink-0 items-center justify-center border-b border-neutral-400 bg-neutral-100"
        >
          <span class="text-sm tracking-wide text-neutral-500">Header</span>
        </header>

        <main class="flex flex-1 items-center justify-center">
          <span class="text-sm tracking-wide text-neutral-500">Content</span>
        </main>
      </div>
    </div>
  </body>
</html>
