<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechCart Admin — Layout Mock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-primary-50: #eef2ff;
        --color-primary-100: #e0e7ff;
        --color-primary-200: #c7d2fe;
        --color-primary-300: #a5b4fc;
        --color-primary-400: #818cf8;
        --color-primary-500: #6366f1;
        --color-primary-600: #4f46e5;
        --color-primary-700: #4338ca;
        --color-primary-800: #3730a3;
        --color-primary-900: #312e81;

        --color-accent-50: #fff7ed;
        --color-accent-100: #ffedd5;
        --color-accent-200: #fed7aa;
        --color-accent-300: #fdba74;
        --color-accent-400: #fb923c;
        --color-accent-500: #f97316;
        --color-accent-600: #ea580c;
        --color-accent-700: #c2410c;
        --color-accent-800: #9a3412;
        --color-accent-900: #7c2d12;

        --font-sans:
          "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
      }
    </style>
  </head>
  <body class="h-screen bg-white text-neutral-600">
    <div class="flex h-screen">
      <!-- Sidebar — full height, left edge -->
      <aside class="flex w-64 shrink-0 flex-col border-r border-neutral-200 bg-white">
        <a
          href="./index.html"
          class="flex h-16 shrink-0 items-center gap-2 border-b border-neutral-200 px-4"
        >
          <svg
            class="h-5 w-5 text-accent-600"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none" />
            <circle cx="18" cy="20" r="1.4" fill="currentColor" stroke="none" />
            <path d="M2.5 3.5h2.4l2.7 12.5h9.7l2.2-8.5H6" />
          </svg>
          <div class="flex flex-col leading-tight">
            <span class="text-sm font-extrabold tracking-tight text-neutral-900">
              Tech<span class="text-primary-600">Cart</span>
            </span>
            <span class="text-[10px] font-medium tracking-wide text-neutral-400 uppercase">
              Admin
            </span>
          </div>
        </a>

        <nav class="flex flex-1 flex-col gap-0.5 overflow-y-auto p-2 text-sm">
          <a href="#" class="rounded-md bg-primary-50 px-3 py-2 font-medium text-primary-700">
            Dashboard
          </a>
          <a
            href="./product-list.html"
            class="rounded-md px-3 py-2 text-neutral-600 hover:bg-neutral-100"
          >
            Products
          </a>
          <a
            href="./category-list.html"
            class="rounded-md px-3 py-2 text-neutral-600 hover:bg-neutral-100"
          >
            Categories
          </a>
          <a
            href="./brand-list.html"
            class="rounded-md px-3 py-2 text-neutral-600 hover:bg-neutral-100"
          >
            Brands
          </a>
          <a
            href="./specification-editor.html"
            class="rounded-md px-3 py-2 text-neutral-600 hover:bg-neutral-100"
          >
            Specifications
          </a>
          <a
            href="./variant-type-editor.html"
            class="rounded-md px-3 py-2 text-neutral-600 hover:bg-neutral-100"
          >
            Variant types
          </a>
          <a href="#" class="rounded-md px-3 py-2 text-neutral-600 hover:bg-neutral-100">Orders</a>
        </nav>

        <div class="mt-auto border-t border-neutral-200 p-3">
          <div class="flex items-center gap-2 rounded-md p-2">
            <span
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary-100 text-sm font-semibold text-primary-700"
            >
              A
            </span>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-medium text-neutral-900">Admin User</p>
              <p class="truncate text-xs text-neutral-500">Catalog Manager</p>
            </div>
          </div>
          <a
            href="#"
            class="mt-2 flex items-center justify-center rounded-md border border-neutral-200 px-3 py-2 text-sm font-medium text-neutral-600 hover:bg-neutral-50"
          >
            Logout
          </a>
        </div>
      </aside>

      <!-- Content — header removed; sidebar + main only -->
      <main class="flex flex-1 items-center justify-center">
        <span
          class="rounded-lg border border-neutral-200 px-6 py-4 text-sm tracking-wide text-neutral-500"
        >
          Content
        </span>
      </main>
    </div>
  </body>
</html>
