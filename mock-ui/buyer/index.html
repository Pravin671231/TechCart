<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechCart — Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-neutral-50 text-neutral-900">
    <div id="site-header"></div>

    <main class="mx-auto max-w-6xl px-4 py-6">
      <div class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-semibold tracking-tight">All products</h1>
        <button
          id="simulate-error-btn"
          type="button"
          class="text-xs text-neutral-400 underline hover:text-neutral-600"
        >
          Simulate fetch error
        </button>
      </div>

      <div class="flex flex-col gap-6 lg:flex-row">
        <!-- Filters sidebar -->
        <aside class="w-full shrink-0 space-y-6 lg:w-64">
          <div>
            <h2 class="mb-2 text-sm font-semibold text-neutral-700">Category</h2>
            <div id="filter-category" class="space-y-1 text-sm"></div>
          </div>
          <div>
            <h2 class="mb-2 text-sm font-semibold text-neutral-700">Brand</h2>
            <div id="filter-brand" class="space-y-1 text-sm"></div>
          </div>
          <div>
            <h2 class="mb-2 text-sm font-semibold text-neutral-700">Price range (₹)</h2>
            <div class="flex items-center gap-2">
              <input
                id="filter-min-price"
                type="number"
                min="0"
                placeholder="Min"
                class="w-full rounded-md border border-neutral-300 px-2 py-1 text-sm"
              />
              <span class="text-neutral-400">–</span>
              <input
                id="filter-max-price"
                type="number"
                min="0"
                placeholder="Max"
                class="w-full rounded-md border border-neutral-300 px-2 py-1 text-sm"
              />
            </div>
          </div>
          <div>
            <h2 class="mb-2 text-sm font-semibold text-neutral-700">Variant attributes</h2>
            <div id="filter-variants" class="space-y-3 text-sm"></div>
          </div>
          <button
            id="clear-filters-btn"
            type="button"
            class="text-xs text-neutral-500 underline hover:text-neutral-700"
          >
            Clear all filters
          </button>
        </aside>

        <!-- Grid + toolbar -->
        <section class="flex-1">
          <div class="mb-4 flex items-center justify-between">
            <p id="result-count" class="text-sm text-neutral-500"></p>
            <select
              id="sort-select"
              class="rounded-md border border-neutral-300 px-2 py-1.5 text-sm"
            >
              <option value="relevance">Sort: Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="newest">Newest first</option>
            </select>
          </div>

          <div id="grid-container"></div>
          <div id="pagination-container" class="mt-6 flex justify-center gap-2"></div>
        </section>
      </div>
    </main>

    <script src="../shared/mock-data.js"></script>
    <script src="../shared/helpers.js"></script>
    <script src="../shared/buyer-header.js"></script>
    <script src="../shared/product-grid.js"></script>
    <script src="js/catalog.js"></script>
  </body>
</html>
