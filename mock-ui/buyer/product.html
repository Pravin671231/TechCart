<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechCart — Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-neutral-50 text-neutral-900">
    <div id="site-header"></div>

    <main class="mx-auto max-w-5xl px-4 py-6">
      <div id="not-found" class="hidden rounded-lg border border-dashed border-neutral-300 py-16 text-center">
        <p class="text-sm font-medium text-neutral-600">Product not found.</p>
        <a href="index.html" class="mt-2 inline-block text-sm text-neutral-900 underline">Back to all products</a>
      </div>

      <div id="product-content" class="hidden">
        <nav id="breadcrumb" class="mb-4 text-sm text-neutral-500"></nav>

        <div class="grid grid-cols-1 gap-8 md:grid-cols-2">
          <!-- Gallery -->
          <div>
            <div id="main-image" class="mb-3 flex aspect-square items-center justify-center rounded-lg bg-neutral-100 text-lg font-medium text-neutral-400"></div>
            <div id="thumbnails" class="flex gap-2"></div>
          </div>

          <!-- Info -->
          <div>
            <a id="brand-link" href="#" class="text-sm font-medium text-neutral-500 hover:underline"></a>
            <h1 id="product-name" class="mb-1 text-2xl font-semibold tracking-tight"></h1>
            <a id="category-link" href="#" class="text-sm text-neutral-500 hover:underline"></a>

            <div id="price-row" class="mt-4 flex items-center gap-2"></div>
            <div id="stock-badge" class="mt-2"></div>

            <div id="variant-section" class="mt-5 space-y-3"></div>

            <p id="product-description" class="mt-5 text-sm leading-relaxed text-neutral-600"></p>

            <div class="mt-6 rounded-md bg-amber-50 px-3 py-2 text-xs text-amber-700">
              Read-only preview — "Add to cart" ships in SRS v0.4.
            </div>

            <h2 class="mt-6 mb-2 text-sm font-semibold text-neutral-700">Specifications</h2>
            <table id="spec-table" class="w-full text-sm">
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script src="../shared/mock-data.js"></script>
    <script src="../shared/helpers.js"></script>
    <script src="../shared/buyer-header.js"></script>
    <script src="js/product.js"></script>
  </body>
</html>
