<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechCart — Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-neutral-50 text-neutral-900">
    <div id="site-header"></div>

    <main class="mx-auto max-w-6xl px-4 py-6">
      <h1 class="mb-1 text-2xl font-semibold tracking-tight">Search results</h1>
      <p id="query-label" class="mb-4 text-sm text-neutral-500"></p>

      <div class="mb-4 flex items-center justify-between">
        <p id="result-count" class="text-sm text-neutral-500"></p>
        <select id="sort-select" class="rounded-md border border-neutral-300 px-2 py-1.5 text-sm">
          <option value="relevance">Sort: Relevance</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="newest">Newest first</option>
        </select>
      </div>

      <div id="grid-container"></div>
      <div id="pagination-container" class="mt-6 flex justify-center gap-2"></div>
    </main>

    <script src="../shared/mock-data.js"></script>
    <script src="../shared/helpers.js"></script>
    <script src="../shared/buyer-header.js"></script>
    <script src="../shared/product-grid.js"></script>
    <script src="js/search.js"></script>
  </body>
</html>
