name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, buyer-app, admin-app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # mongodb-memory-server (backend/__tests__/auth, Issue #139) downloads
      # its own MongoDB binary on first use — caching it keeps that off the
      # critical path of every subsequent run.
      - if: matrix.workspace == 'backend'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm run test --workspace ${{ matrix.workspace }}

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, buyer-app, admin-app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # buyer-app/src/store/env.ts throws at import time if these are unset,
      # and `next build` statically evaluates pages that import it — dummy
      # values are enough to prove the build itself compiles cleanly.
      - if: matrix.workspace == 'buyer-app'
        run: npm run build --workspace buyer-app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-client-id
      - if: matrix.workspace != 'buyer-app'
        run: npm run build --workspace ${{ matrix.workspace }}
